services:
  postgres:
    image: postgres:15
    container_name: postgres_satria
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "22078:5432"
    volumes:
      - pgdata_satria:/var/lib/postgresql/data
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - net_uts_satria

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_satria
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "44078:80"
    volumes:
      - pgadmin_data_satria:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net_uts_satria

volumes:
  pgdata_satria:
  pgadmin_data_satria:

networks:
  net_uts_satria:

